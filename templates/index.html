<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="calculator-card">
        <div class="calculator-header">
            <p class="eyebrow">Everyday arithmetic</p>
            <h1>Simple Calculator</h1>
            <p class="intro">Enter two numbers and choose an operation.</p>
        </div>

        <form method="post" class="calculator-form">
            <div class="form-row">
                <label for="first_number">First number</label>
                <input
                    type="number"
                    id="first_number"
                    name="first_number"
                    value="{{ first_number }}"
                    step="any"
                    placeholder="e.g. 10"
                    required
                >
            </div>

            <div class="form-row">
                <label for="operator">Operation</label>
                <select id="operator" name="operator">
                    <option value="+" {% if operator == "+" %}selected{% endif %}>Addition (+)</option>
                    <option value="-" {% if operator == "-" %}selected{% endif %}>Subtraction (-)</option>
                    <option value="*" {% if operator == "*" %}selected{% endif %}>Multiplication (*)</option>
                    <option value="/" {% if operator == "/" %}selected{% endif %}>Division (/)</option>
                </select>
            </div>

            <div class="form-row">
                <label for="second_number">Second number</label>
                <input
                    type="number"
                    id="second_number"
                    name="second_number"
                    value="{{ second_number }}"
                    step="any"
                    placeholder="e.g. 5"
                    required
                >
            </div>

            <button type="submit">Calculate</button>
        </form>

        {% if result is not none %}
            <section class="result" aria-live="polite">
                <p class="result-label">Result</p>
                <p class="result-value">{{ first_number }} {{ operator }} {{ second_number }} = {{ result }}</p>
            </section>
        {% endif %}

        {% if error %}
            <section class="error" aria-live="assertive">
                <p>{{ error }}</p>
            </section>
        {% endif %}
    </main>
</body>
</html>
